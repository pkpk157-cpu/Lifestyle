name: Android APK

# Builds the native shell and attaches the APK to a GitHub release, so the
# phone can install it straight from the releases page. The web app itself is
# still served from GitHub Pages; this is only for the SMS-scanning build.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.json
      - icon-*.png
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Android assets are a copy of the web app and are not committed,
      # so every build makes its own.
      - name: Copy the web app into the Android assets
        run: android/sync-web.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Without a keystore secret the build still produces an installable APK,
      # it is just debug-signed: fine for a first look, but its signature
      # changes every run, so later builds will not install over it.
      - name: Decode the signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lifestyle.jks"
            echo "path=$RUNNER_TEMP/lifestyle.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret - falling back to a debug build."
          fi

      - name: Build the APK
        working-directory: android
        env:
          LIFESTYLE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          LIFESTYLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFESTYLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFESTYLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LIFESTYLE_VERSION_CODE: ${{ github.run_number }}
          LIFESTYLE_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect it
        id: apk
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          if [ ! -f "$SRC" ]; then
            echo "Expected an APK at $SRC but there is none:"
            find android/app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          OUT="lifestyle-1.0.${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lifestyle-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      # A release gives a direct .apk link the phone can download and open.
      # A workflow artifact would arrive as a zip, which Android cannot install.
      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            NOTE="Signed with the release key, so this installs over an earlier build and keeps your data."
          else
            NOTE="**Debug-signed.** It installs, but its signature changes every build, so the next one will not install over it. Add the ANDROID_KEYSTORE_BASE64 secret to fix that."
          fi
          gh release create "build-${{ github.run_number }}" "${{ steps.apk.outputs.file }}" \
            --title "Lifestyle 1.0.${{ github.run_number }}" \
            --latest \
            --notes "Open this page on the phone and tap the .apk to install (${{ steps.apk.outputs.size }}).

          $NOTE

          Built from \`${{ github.sha }}\`. Reads the SMS inbox on the device; declares no INTERNET permission."
